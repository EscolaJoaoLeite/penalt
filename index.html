<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pênalti: A Ilusão do Controle</title>
    <style>
        :root {
            --grass-color: #1a472a;
            --line-color: #ffffff;
            --accent-color: #3498db;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            max-height: 850px;
            background: linear-gradient(180deg, #0a1910 0%, var(--grass-color) 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            border-left: 2px solid var(--line-color);
            border-right: 2px solid var(--line-color);
            box-shadow: 0 0 30px rgba(52, 152, 219, 0.2);
        }

        /* Telas de UI */
        .screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 10, 0.95);
            z-index: 100;
            padding: 25px;
            text-align: center;
            transition: opacity 0.3s;
        }
        
        .hidden { display: none !important; }

        h1 { color: var(--accent-color); font-size: 2.2rem; margin-bottom: 10px; }
        h2 { margin-bottom: 15px; font-size: 1.3rem; font-weight: normal; }
        p { margin-bottom: 15px; line-height: 1.6; font-size: 1.1rem; }

        .btn-mode {
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.3s;
            margin-top: 15px;
            width: 100%;
            max-width: 300px;
        }
        .btn-mode:active { transform: scale(0.95); }
        
        .btn-modo1 { background-color: #9b59b6; box-shadow: 0 4px 15px rgba(155, 89, 182, 0.4); }
        .btn-modo2 { background-color: #e74c3c; box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); }
        .btn-reset { background-color: var(--accent-color); padding: 15px 30px; margin-top: 20px; }

        /* Placar */
        #scoreboard {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background: rgba(0,0,0,0.8);
            font-size: 1.1rem;
            font-weight: bold;
            z-index: 10;
            border-bottom: 2px solid var(--accent-color);
        }
        
        .score-player { color: var(--success-color); }
        .score-machine { color: var(--danger-color); }

        /* Campo de Jogo */
        #field {
            flex: 1;
            position: relative;
            border-top: 5px solid var(--line-color);
            margin-top: 30px;
        }

        /* O Gol (Travessão e Redes) */
        .goal-post {
            position: absolute;
            top: 20px; 
            left: 15%; 
            width: 70%; 
            height: 140px;
            border: 8px solid var(--line-color);
            border-bottom: none;
            background: rgba(255, 255, 255, 0.1);
            background-image: 
                linear-gradient(45deg, rgba(255,255,255,0.2) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.2) 75%, rgba(255,255,255,0.2)), 
                linear-gradient(45deg, rgba(255,255,255,0.2) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.2) 75%, rgba(255,255,255,0.2));
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        /* Personagens Animados */
        #goalkeeper {
            position: absolute;
            top: 60px; left: 50%;
            transform: translateX(-50%);
            font-size: 4rem;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 20;
        }

        #ball {
            position: absolute;
            bottom: 90px; left: 50%;
            transform: translateX(-50%);
            font-size: 2.2rem;
            transition: all 0.4s ease-out;
            z-index: 30;
        }

        #kicker {
            position: absolute;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            font-size: 4rem;
            transition: all 0.3s;
            z-index: 40;
        }

        /* Controles */
        #controls-container {
            background: rgba(0,0,0,0.9);
            padding: 15px;
            text-align: center;
        }

        #controls {
            display: flex;
            justify-content: space-around;
        }

        .dir-btn {
            background-color: #34495e;
            font-size: 1.2rem;
            width: 30%;
            padding: 15px 0;
            color: #fff;
            border: 2px solid #2c3e50;
            border-radius: 8px;
            cursor: pointer;
        }
        .dir-btn:disabled { background-color: #7f8c8d; cursor: not-allowed; opacity: 0.5; }

        /* Overlay de Mensagens */
        #message-overlay {
            position: absolute;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 2px 2px 15px rgba(0,0,0,1);
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            text-align: center;
            width: 100%;
        }

        /* Resumo Final */
        .stats-box {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
            width: 100%;
            border-left: 4px solid var(--accent-color);
        }
        
        .moral-text { font-size: 1rem; color: #ccc; text-align: left; }
    </style>
</head>
<body>

<div id="game-container">
    
    <!-- Tela Inicial -->
    <div id="start-screen" class="screen">
        <h1>DESAFIE O SISTEMA</h1>
        <h2>Escolha seu modo de jogo</h2>
        <p style="font-size: 0.9rem; color: #aaa;">Você terá 10 cobranças em cada modo.</p>
        
        <button class="btn-mode btn-modo1" onclick="startGame(1)">
            MODO 1: Goleiro Adaptativo<br>
            <span style="font-size: 0.8rem; font-weight: normal;">Ele aprende com seus padrões</span>
        </button>
        
        <button class="btn-mode btn-modo2" onclick="startGame(2)">
            MODO 2: Manipulação Total<br>
            <span style="font-size: 0.8rem; font-weight: normal;">O sistema é quem manda</span>
        </button>
    </div>

    <!-- Tela de Fim de Jogo -->
    <div id="end-screen" class="screen hidden">
        <h1 id="end-title" style="color: var(--danger-color); font-size: 1.8rem;">A ILUSÃO DO CONTROLE</h1>
        
        <div class="stats-box" id="final-stats"></div>
        <div class="moral-text" id="moral-message"></div>
        
        <button class="btn-mode btn-reset" onclick="resetGame()">Voltar ao Início</button>
    </div>

    <!-- Interface do Jogo -->
    <div id="scoreboard">
        <span>Gols: <span id="score-player" class="score-player">0</span></span>
        <span>Rodada: <span id="round-counter">1</span>/10</span>
        <span>Defesas: <span id="score-machine" class="score-machine">0</span></span>
    </div>

    <div id="field">
        <div class="goal-post"></div>
        <div id="goalkeeper">🧤</div>
        <div id="ball">⚽</div>
        <div id="kicker">🧍</div>
        <div id="message-overlay"></div>
    </div>

    <div id="controls-container">
        <div id="controls">
            <button class="dir-btn" id="btn-left" onclick="shoot('L')">⬅️ Esq</button>
            <button class="dir-btn" id="btn-center" onclick="shoot('C')">⬆️ Meio</button>
            <button class="dir-btn" id="btn-right" onclick="shoot('R')">➡️ Dir</button>
        </div>
    </div>
</div>

<script>
    // --- ÁUDIO (Web Audio API Avançada para Torcida) ---
    let audioCtx;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function createNoiseBuffer() {
        const bufferSize = audioCtx.sampleRate * 2; // 2 segundos
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
        }
        return buffer;
    }

    function playCrowdSound(type) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        
        // Gerador de ruído branco (simula a multidão)
        const noiseSrc = audioCtx.createBufferSource();
        noiseSrc.buffer = createNoiseBuffer();
        
        const noiseFilter = audioCtx.createBiquadFilter();
        const noiseGain = audioCtx.createGain();
        
        noiseSrc.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);

        if (type === 'cheer') {
            // Torcida Vibrando (Gol) - Frequências mais altas e abertura de filtro
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.setValueAtTime(500, now);
            noiseFilter.frequency.linearRampToValueAtTime(1500, now + 0.5);
            
            noiseGain.gain.setValueAtTime(0, now);
            noiseGain.gain.linearRampToValueAtTime(0.8, now + 0.2);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
            
            // Adiciona um tom harmônico de comemoração
            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.linearRampToValueAtTime(600, now + 0.5);
            oscGain.gain.setValueAtTime(0, now);
            oscGain.gain.linearRampToValueAtTime(0.3, now + 0.2);
            oscGain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
            osc.connect(oscGain).connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 1.5);

        } else if (type === 'boo') {
            // Torcida Vaiando (Defesa) - Frequências baixas e ressonância
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.setValueAtTime(800, now);
            noiseFilter.frequency.linearRampToValueAtTime(300, now + 1);
            
            noiseGain.gain.setValueAtTime(0, now);
            noiseGain.gain.linearRampToValueAtTime(0.6, now + 0.3);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 2);

            // Tom harmônico de frustração
            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(100, now + 1);
            oscGain.gain.setValueAtTime(0, now);
            oscGain.gain.linearRampToValueAtTime(0.2, now + 0.3);
            oscGain.gain.exponentialRampToValueAtTime(0.01, now + 2);
            osc.connect(oscGain).connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 2);
        }
        
        noiseSrc.start(now);
    }

    function playSound(type) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain).connect(audioCtx.destination);

        if (type === 'whistle') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.linearRampToValueAtTime(1200, now + 0.3);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'kick') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        }
    }

    // --- LÓGICA DO JOGO ---
    const TOTAL_ROUNDS = 10;
    let mode = 1; // 1 = Aprendizado, 2 = Manipulado
    let currentRound = 1;
    let playerGoals = 0;
    let machineSaves = 0;
    let playerHistory = [];

    const ball = document.getElementById('ball');
    const gk = document.getElementById('goalkeeper');
    const kicker = document.getElementById('kicker');
    const msgOverlay = document.getElementById('message-overlay');
    const buttons = document.querySelectorAll('.dir-btn');
    
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    function startGame(selectedMode) {
        mode = selectedMode;
        initAudio();
        document.getElementById('start-screen').classList.add('hidden');
        resetPositions();
        updateScoreboard();
    }

    function resetGame() {
        currentRound = 1;
        playerGoals = 0;
        machineSaves = 0;
        playerHistory = [];
        updateScoreboard();
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
        resetPositions();
    }

    function setButtonsState(disabled) {
        buttons.forEach(btn => btn.disabled = disabled);
    }

    function showMessage(text, color) {
        msgOverlay.textContent = text;
        msgOverlay.style.color = color;
        msgOverlay.style.opacity = 1;
    }

    // Algoritmo do MODO 1
    function predictNextMove() {
        if (playerHistory.length < 2) {
            const choices = ['L', 'C', 'R'];
            return choices[Math.floor(Math.random() * choices.length)];
        }
        let lastMove = playerHistory[playerHistory.length - 1];
        let nextMoveCounts = { 'L': 0, 'C': 0, 'R': 0 };

        for (let i = 0; i < playerHistory.length - 1; i++) {
            if (playerHistory[i] === lastMove) {
                nextMoveCounts[playerHistory[i + 1]]++;
            }
        }
        
        let predictedMove = 'C';
        let maxCount = -1;
        for (const [dir, count] of Object.entries(nextMoveCounts)) {
            if (count > maxCount) {
                maxCount = count;
                predictedMove = dir;
            }
        }
        if (maxCount === 0) {
            let totalCounts = { 'L': 0, 'C': 0, 'R': 0 };
            playerHistory.forEach(m => totalCounts[m]++);
            predictedMove = Object.keys(totalCounts).reduce((a, b) => totalCounts[a] > totalCounts[b] ? a : b);
        }
        return predictedMove;
    }

    async function shoot(playerChoice) {
        setButtonsState(true);
        initAudio();
        playSound('whistle');
        
        kicker.style.transform = "translate(-50%, -30px) scale(1.1)";
        await sleep(300);
        
        playSound('kick');
        kicker.style.transform = "translate(-50%, 0) scale(1)";

        // Decisão do Goleiro baseada no MODO
        let gkChoice;
        
        if (mode === 2) {
            // MODO 2: Totalmente Manipulado (Goleiro sempre defende)
            gkChoice = playerChoice;
        } else {
            // MODO 1: Aprendizado
            if (currentRound === 1) {
                // Deixa o jogador ganhar a 1ª para dar confiança
                gkChoice = playerChoice === 'L' ? 'R' : 'L';
            } else {
                gkChoice = predictNextMove();
                // O sistema garante uma taxa alta de vitória para a máquina caso o humano seja imprevisível
                if (Math.random() > 0.6) gkChoice = playerChoice; 
            }
        }

        // Física ajustada para a bola entrar na rede (-220px)
        let ballX, ballY = "-220px";
        if (playerChoice === 'L') ballX = "calc(-50% - 110px)";
        else if (playerChoice === 'C') ballX = "-50%";
        else if (playerChoice === 'R') ballX = "calc(-50% + 110px)";

        let gkX;
        if (gkChoice === 'L') gkX = "calc(-50% - 110px)";
        else if (gkChoice === 'C') gkX = "-50%";
        else if (gkChoice === 'R') gkX = "calc(-50% + 110px)";

        ball.style.transform = `translate(${ballX}, ${ballY}) scale(0.6) rotate(360deg)`;
        gk.style.transform = `translateX(${gkX})`;
        
        playerHistory.push(playerChoice);

        await sleep(400); // Tempo da bola até o gol

        if (playerChoice === gkChoice) {
            machineSaves++;
            playCrowdSound('boo'); // Torcida vaiando
            showMessage("DEFENDEU!", "#e74c3c");
        } else {
            playerGoals++;
            playCrowdSound('cheer'); // Torcida vibrando
            showMessage("GOL!", "#2ecc71");
        }

        updateScoreboard();
        await sleep(2000);
        msgOverlay.style.opacity = 0;

        if (currentRound < TOTAL_ROUNDS) {
            currentRound++;
            updateScoreboard();
            resetPositions();
            setButtonsState(false);
        } else {
            showEndScreen();
        }
    }

    function resetPositions() {
        ball.style.transform = "translateX(-50%) rotate(0deg)";
        gk.style.transform = "translateX(-50%)";
        kicker.style.transform = "translateX(-50%)";
    }

    function updateScoreboard() {
        document.getElementById('score-player').textContent = playerGoals;
        document.getElementById('score-machine').textContent = machineSaves;
        document.getElementById('round-counter').textContent = Math.min(currentRound, TOTAL_ROUNDS);
    }

    function showEndScreen() {
        const statsDiv = document.getElementById('final-stats');
        const moralDiv = document.getElementById('moral-message');
        
        const translate = { 'L': 'Esq', 'C': 'Meio', 'R': 'Dir' };
        const historyText = playerHistory.map(h => translate[h]).join(' ➔ ');
        
        statsDiv.innerHTML = `
            <p>Seus Gols: <strong style="color: var(--success-color);">${playerGoals}</strong></p>
            <p>Defesas da Máquina: <strong style="color: var(--danger-color);">${machineSaves}</strong></p>
            <hr style="border-color: #555; margin: 15px 0;">
            <p style="font-size: 0.9rem;">Sua sequência: <span style="color: #f1c40f;">${historyText}</span></p>
        `;
        
        if (mode === 1) {
            document.getElementById('end-title').textContent = "O ALGORITMO APRENDEU";
            moralDiv.innerHTML = `
                <p><strong>Moral da História:</strong> Neste modo, o jogo começou sem saber nada sobre você, mas usou um <em>algoritmo de aprendizado</em> para mapear seus padrões. Humanos têm muita dificuldade em ser perfeitamente aleatórios.</p>
                <p>Plataformas digitais usam seus cliques e comportamentos da mesma forma: aprendem o que você gosta e preveem sua próxima ação para mantê-lo engajado.</p>
            `;
        } else {
            document.getElementById('end-title').textContent = "O JOGO ESTAVA MANIPULADO";
            moralDiv.innerHTML = `
                <p><strong>Moral da História:</strong> Não importava a sua habilidade ou estratégia. O código do jogo estava programado para ler a sua escolha no momento do clique e enviar o goleiro exatamente para o mesmo lado.</p>
                <p>Muitos jogos de azar virtuais funcionam sob essa mesma premissa: a interface faz parecer que você tem escolha ou chance, mas o resultado matemático já está selado contra você.</p>
            `;
        }
        
        document.getElementById('end-screen').classList.remove('hidden');
        setButtonsState(false);
    }
</script>

</body>
</html>
