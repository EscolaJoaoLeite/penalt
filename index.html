<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pênalti: A Ilusão do Controle</title>
    <style>
        :root {
            --grass-color: #1a472a;
            --line-color: #ffffff;
            --accent-color: #3498db;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            max-height: 850px;
            background: linear-gradient(180deg, #0a1910 0%, var(--grass-color) 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            border-left: 2px solid var(--line-color);
            border-right: 2px solid var(--line-color);
            box-shadow: 0 0 30px rgba(52, 152, 219, 0.2);
        }

        /* Telas de UI */
        .screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 10, 0.95);
            z-index: 100;
            padding: 25px;
            text-align: center;
            transition: opacity 0.3s;
        }
        
        .hidden { display: none !important; }

        h1 { color: var(--accent-color); font-size: 2.2rem; margin-bottom: 10px; }
        h2 { margin-bottom: 15px; font-size: 1.3rem; font-weight: normal; }
        p { margin-bottom: 15px; line-height: 1.6; font-size: 1.1rem; }

        .btn-mode {
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
            margin-top: 15px;
            width: 100%;
            max-width: 300px;
        }
        .btn-mode:active { transform: scale(0.95); }
        
        .btn-modo1 { background-color: #9b59b6; }
        .btn-modo2 { background-color: #e74c3c; }
        .btn-reset { background-color: var(--accent-color); padding: 15px 30px; margin-top: 20px; }

        /* Placar */
        #scoreboard {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background: rgba(0,0,0,0.8);
            font-size: 1.1rem;
            font-weight: bold;
            z-index: 10;
            border-bottom: 2px solid var(--accent-color);
        }
        
        .score-player { color: var(--success-color); }
        .score-machine { color: var(--danger-color); }

        /* Campo de Jogo */
        #field {
            flex: 1;
            position: relative;
            border-top: 5px solid var(--line-color);
            margin-top: 30px;
        }

        .goal-post {
            position: absolute;
            top: 20px; left: 15%; width: 70%; height: 140px;
            border: 8px solid var(--line-color);
            border-bottom: none;
            background: rgba(255, 255, 255, 0.1);
            background-image: linear-gradient(45deg, rgba(255,255,255,0.2) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.2) 75%, rgba(255,255,255,0.2)), linear-gradient(45deg, rgba(255,255,255,0.2) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.2) 75%, rgba(255,255,255,0.2));
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        /* Animações e Avatares SVG */
        #goalkeeper {
            position: absolute;
            top: 50px; left: 50%;
            transform: translateX(-50%);
            width: 100px; height: 100px;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 20;
            transform-origin: center bottom;
        }

        /* Animação de respiração/espera do goleiro */
        @keyframes idleGk {
            0% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-5px); }
            100% { transform: translateX(-50%) translateY(0); }
        }
        .idle { animation: idleGk 1.5s infinite ease-in-out; }

        #ball {
            position: absolute;
            bottom: 100px; left: 50%;
            transform: translateX(-50%);
            width: 40px; height: 40px;
            transition: all 0.4s ease-out;
            z-index: 30;
        }

        #kicker {
            position: absolute;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            width: 80px; height: 120px;
            transition: all 0.3s;
            z-index: 40;
        }

        /* Animação da perna chutando */
        .kicking-leg {
            transform-origin: 50% 10%;
            transition: transform 0.15s ease-in-out;
        }
        .is-kicking .kicking-leg {
            transform: rotate(-45deg);
        }

        /* Controles */
        #controls-container {
            background: rgba(0,0,0,0.9);
            padding: 15px;
        }

        #controls {
            display: flex;
            justify-content: space-around;
        }

        .dir-btn {
            background-color: #34495e;
            font-size: 1.2rem;
            width: 30%;
            padding: 15px 0;
            color: #fff;
            border: 2px solid #2c3e50;
            border-radius: 8px;
            cursor: pointer;
        }
        .dir-btn:disabled { background-color: #7f8c8d; cursor: not-allowed; opacity: 0.5; }

        #message-overlay {
            position: absolute;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 2px 2px 15px rgba(0,0,0,1);
            z-index: 50;
            opacity: 0;
            transition: opacity 0.2s;
            text-align: center;
            width: 100%;
        }

        .stats-box {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
            width: 100%;
            border-left: 4px solid var(--accent-color);
        }
    </style>
</head>
<body>

<div id="game-container">
    
    <div id="start-screen" class="screen">
        <h1>DESAFIE O SISTEMA</h1>
        <h2>Escolha seu modo de jogo</h2>
        <p style="font-size: 0.9rem; color: #aaa;">Você terá 10 cobranças em cada modo.</p>
        
        <button class="btn-mode btn-modo1" onclick="startGame(1)">
            MODO 1: Goleiro Adaptativo<br>
            <span style="font-size: 0.8rem; font-weight: normal;">Ele aprende com seus padrões</span>
        </button>
        
        <button class="btn-mode btn-modo2" onclick="startGame(2)">
            MODO 2: Manipulação Total<br>
            <span style="font-size: 0.8rem; font-weight: normal;">O sistema é quem manda</span>
        </button>
    </div>

    <div id="end-screen" class="screen hidden">
        <h1 id="end-title" style="color: var(--danger-color); font-size: 1.8rem;">A ILUSÃO DO CONTROLE</h1>
        <div class="stats-box" id="final-stats"></div>
        <div id="moral-message" style="font-size: 1rem; color: #ccc; text-align: left;"></div>
        <button class="btn-mode btn-reset" onclick="resetGame()">Voltar ao Início</button>
    </div>

    <div id="scoreboard">
        <span>Gols: <span id="score-player" class="score-player">0</span></span>
        <span>Rodada: <span id="round-counter">1</span>/10</span>
        <span>Defesas: <span id="score-machine" class="score-machine">0</span></span>
    </div>

    <div id="field">
        <div class="goal-post"></div>
        
        <!-- SVG Goleiro -->
        <div id="goalkeeper" class="idle">
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <!-- Cabeça -->
                <circle cx="50" cy="20" r="12" fill="#f1c40f"/>
                <!-- Corpo -->
                <rect x="35" y="32" width="30" height="40" rx="5" fill="#e74c3c"/>
                <!-- Braços -->
                <rect x="5" y="35" width="90" height="8" rx="4" fill="#f1c40f"/>
                <!-- Luvas -->
                <circle cx="10" cy="39" r="6" fill="#ecf0f1"/>
                <circle cx="90" cy="39" r="6" fill="#ecf0f1"/>
                <!-- Pernas -->
                <rect x="38" y="70" width="10" height="25" rx="3" fill="#222"/>
                <rect x="52" y="70" width="10" height="25" rx="3" fill="#222"/>
            </svg>
        </div>

        <!-- SVG Bola -->
        <div id="ball">
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <circle cx="50" cy="50" r="45" fill="#fff" stroke="#000" stroke-width="3"/>
                <polygon points="50,20 70,35 62,60 38,60 30,35" fill="#000"/>
                <line x1="50" y1="20" x2="50" y2="5" stroke="#000" stroke-width="3"/>
                <line x1="70" y1="35" x2="90" y2="40" stroke="#000" stroke-width="3"/>
                <line x1="62" y1="60" x2="75" y2="85" stroke="#000" stroke-width="3"/>
                <line x1="38" y1="60" x2="25" y2="85" stroke="#000" stroke-width="3"/>
                <line x1="30" y1="35" x2="10" y2="40" stroke="#000" stroke-width="3"/>
            </svg>
        </div>

        <!-- SVG Batedor -->
        <div id="kicker">
            <svg viewBox="0 0 100 150" width="100%" height="100%">
                <!-- Cabeça -->
                <circle cx="50" cy="30" r="15" fill="#f1c40f"/>
                <!-- Corpo -->
                <rect x="35" y="45" width="30" height="50" rx="5" fill="#3498db"/>
                <!-- Braços -->
                <rect x="25" y="50" width="10" height="40" rx="5" fill="#f1c40f" transform="rotate(15, 30, 50)"/>
                <rect x="65" y="50" width="10" height="40" rx="5" fill="#f1c40f" transform="rotate(-15, 70, 50)"/>
                <!-- Perna Esquerda (Apoio) -->
                <rect x="38" y="90" width="12" height="45" rx="5" fill="#2c3e50"/>
                <!-- Perna Direita (Chute - Articulada) -->
                <g class="kicking-leg">
                    <rect x="52" y="90" width="12" height="45" rx="5" fill="#2c3e50"/>
                </g>
            </svg>
        </div>

        <div id="message-overlay"></div>
    </div>

    <div id="controls-container">
        <div id="controls">
            <button class="dir-btn" id="btn-left" onclick="shoot('L')">⬅️ Esq</button>
            <button class="dir-btn" id="btn-center" onclick="shoot('C')">⬆️ Meio</button>
            <button class="dir-btn" id="btn-right" onclick="shoot('R')">➡️ Dir</button>
        </div>
    </div>
</div>

<script>
    // --- ÁUDIO (Mantido da versão anterior) ---
    let audioCtx;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

    function createNoiseBuffer() {
        const bufferSize = audioCtx.sampleRate * 2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
        return buffer;
    }

    function playCrowdSound(type) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const noiseSrc = audioCtx.createBufferSource();
        noiseSrc.buffer = createNoiseBuffer();
        const noiseFilter = audioCtx.createBiquadFilter();
        const noiseGain = audioCtx.createGain();
        noiseSrc.connect(noiseFilter).connect(noiseGain).connect(audioCtx.destination);

        if (type === 'cheer') {
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.setValueAtTime(500, now);
            noiseFilter.frequency.linearRampToValueAtTime(1500, now + 0.5);
            noiseGain.gain.setValueAtTime(0, now);
            noiseGain.gain.linearRampToValueAtTime(0.8, now + 0.2);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
        } else if (type === 'boo') {
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.setValueAtTime(800, now);
            noiseFilter.frequency.linearRampToValueAtTime(300, now + 1);
            noiseGain.gain.setValueAtTime(0, now);
            noiseGain.gain.linearRampToValueAtTime(0.6, now + 0.3);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 2);
        }
        noiseSrc.start(now);
    }

    function playSound(type) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain).connect(audioCtx.destination);
        if (type === 'whistle') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.linearRampToValueAtTime(1200, now + 0.3);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'kick') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        }
    }

    // --- LÓGICA DO JOGO ---
    const TOTAL_ROUNDS = 10;
    let mode = 1, currentRound = 1, playerGoals = 0, machineSaves = 0, playerHistory = [];

    const ball = document.getElementById('ball');
    const gk = document.getElementById('goalkeeper');
    const kicker = document.getElementById('kicker');
    const msgOverlay = document.getElementById('message-overlay');
    const buttons = document.querySelectorAll('.dir-btn');
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    function startGame(selectedMode) {
        mode = selectedMode;
        initAudio();
        document.getElementById('start-screen').classList.add('hidden');
        resetPositions();
        updateScoreboard();
    }

    function resetGame() {
        currentRound = 1; playerGoals = 0; machineSaves = 0; playerHistory = [];
        updateScoreboard();
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
        resetPositions();
    }

    function setButtonsState(disabled) { buttons.forEach(btn => btn.disabled = disabled); }
    function showMessage(text, color) { msgOverlay.textContent = text; msgOverlay.style.color = color; msgOverlay.style.opacity = 1; }

    function predictNextMove() {
        if (playerHistory.length < 2) return ['L', 'C', 'R'][Math.floor(Math.random() * 3)];
        let lastMove = playerHistory[playerHistory.length - 1];
        let nextCounts = { 'L': 0, 'C': 0, 'R': 0 };
        for (let i = 0; i < playerHistory.length - 1; i++) {
            if (playerHistory[i] === lastMove) nextCounts[playerHistory[i + 1]]++;
        }
        let max = -1, predicted = 'C';
        for (const [dir, count] of Object.entries(nextCounts)) {
            if (count > max) { max = count; predicted = dir; }
        }
        if (max === 0) {
            let total = { 'L': 0, 'C': 0, 'R': 0 };
            playerHistory.forEach(m => total[m]++);
            predicted = Object.keys(total).reduce((a, b) => total[a] > total[b] ? a : b);
        }
        return predicted;
    }

    async function shoot(playerChoice) {
        setButtonsState(true);
        initAudio();
        playSound('whistle');
        
        gk.classList.remove('idle'); // Para a respiração do goleiro
        
        // Animação do batedor
        kicker.classList.add('is-kicking');
        await sleep(150);
        playSound('kick');

        let gkChoice;
        if (mode === 2) {
            gkChoice = playerChoice;
        } else {
            if (currentRound === 1) gkChoice = playerChoice === 'L' ? 'R' : 'L';
            else {
                gkChoice = predictNextMove();
                if (Math.random() > 0.6) gkChoice = playerChoice; 
            }
        }

        // Posição da bola dentro do gol
        let ballX, ballY = "-200px";
        if (playerChoice === 'L') ballX = "calc(-50% - 100px)";
        else if (playerChoice === 'C') ballX = "-50%";
        else if (playerChoice === 'R') ballX = "calc(-50% + 100px)";

        // Animação de Mergulho do Goleiro
        let gkTransform;
        if (gkChoice === 'L') {
            gkTransform = "translate(calc(-50% - 100px), 30px) rotate(-75deg)";
        } else if (gkChoice === 'C') {
            gkTransform = "translate(-50%, -40px) scale(1.1)"; // Pula no meio
        } else if (gkChoice === 'R') {
            gkTransform = "translate(calc(-50% + 100px), 30px) rotate(75deg)";
        }

        ball.style.transform = `translate(${ballX}, ${ballY}) scale(0.5) rotate(720deg)`;
        gk.style.transform = gkTransform;
        
        playerHistory.push(playerChoice);
        await sleep(400);

        if (playerChoice === gkChoice) {
            machineSaves++;
            playCrowdSound('boo');
            showMessage("DEFENDEU!", "#e74c3c");
        } else {
            playerGoals++;
            playCrowdSound('cheer');
            showMessage("GOL!", "#2ecc71");
        }

        updateScoreboard();
        await sleep(1500);
        kicker.classList.remove('is-kicking'); // Retorna perna
        msgOverlay.style.opacity = 0;

        if (currentRound < TOTAL_ROUNDS) {
            currentRound++;
            updateScoreboard();
            resetPositions();
            setButtonsState(false);
        } else {
            showEndScreen();
        }
    }

    function resetPositions() {
        ball.style.transform = "translateX(-50%) rotate(0deg)";
        gk.style.transform = "translateX(-50%)";
        gk.classList.add('idle');
    }

    function updateScoreboard() {
        document.getElementById('score-player').textContent = playerGoals;
        document.getElementById('score-machine').textContent = machineSaves;
        document.getElementById('round-counter').textContent = Math.min(currentRound, TOTAL_ROUNDS);
    }

    function showEndScreen() {
        const statsDiv = document.getElementById('final-stats');
        const moralDiv = document.getElementById('moral-message');
        const translate = { 'L': 'Esq', 'C': 'Meio', 'R': 'Dir' };
        
        statsDiv.innerHTML = `
            <p>Seus Gols: <strong style="color: var(--success-color);">${playerGoals}</strong></p>
            <p>Defesas da Máquina: <strong style="color: var(--danger-color);">${machineSaves}</strong></p>
            <hr style="border-color: #555; margin: 15px 0;">
            <p style="font-size: 0.9rem;">Sua sequência: <span style="color: #f1c40f;">${playerHistory.map(h => translate[h]).join(' ➔ ')}</span></p>
        `;
        
        if (mode === 1) {
            document.getElementById('end-title').textContent = "O ALGORITMO APRENDEU";
            moralDiv.innerHTML = `<p><strong>Moral da História:</strong> Neste modo, o jogo começou sem saber nada sobre você, mas usou um <em>algoritmo de aprendizado</em> para mapear seus padrões. Humanos têm muita dificuldade em ser perfeitamente aleatórios. Plataformas digitais usam seus cliques da mesma forma para prever sua próxima ação.</p>`;
        } else {
            document.getElementById('end-title').textContent = "O JOGO ESTAVA MANIPULADO";
            moralDiv.innerHTML = `<p><strong>Moral da História:</strong> Não importava a sua habilidade. O código do jogo estava programado para ler a sua escolha no momento do clique e enviar o goleiro exatamente para o mesmo lado. Muitos jogos de azar virtuais funcionam sob essa mesma premissa: a interface faz parecer que você tem escolha, mas o resultado matemático já está selado.</p>`;
        }
        
        document.getElementById('end-screen').classList.remove('hidden');
        setButtonsState(false);
    }
</script>
</body>
</html>
